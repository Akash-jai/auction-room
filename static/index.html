<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auction Room</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e4;--fg:#10244f;--card:#fffdf6;--line:#d9d0b8;--acc:#e8890c;--mut:#5d6a8a;--ok:#1c8a4a;--bad:#c23a2b;padding-top:env(safe-area-inset-top,0)}
@media (prefers-color-scheme:dark){:root{--bg:#0c1c40;--fg:#fbf3dc;--card:#14295a;--line:#2b4278;--acc:#ffb020;--mut:#9fb0d6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1;margin:.2em 0 .3em;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.1rem;margin:1.4em 0 .5em}
p{margin:.4em 0;color:var(--mut)}
button,input,select{font:inherit;color:var(--fg)}
button{cursor:pointer;border:2px solid var(--fg);background:transparent;border-radius:10px;padding:9px 16px;font-weight:600}
input,select{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.go{background:var(--acc);border-color:var(--acc);color:var(--accfg,#1a1200);font-weight:800}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.team{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;text-align:left}
.team i{display:block;height:6px;border-radius:3px;margin-bottom:8px}
.team.me{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.team.taken{opacity:.55}
.team small{display:block;color:var(--mut);font-weight:400}
.lot{background:var(--card);border:2px solid var(--fg);border-radius:16px;padding:18px;display:grid;gap:6px}
.name{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:800;line-height:1.1}
.bid{font-size:clamp(2.4rem,9vw,4.4rem);font-weight:800;color:var(--acc);line-height:1}
.clock{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.stamp{font-weight:800;font-size:1.3rem}.sold{color:var(--ok)}.uns{color:var(--bad)}
.bigbtn{width:100%;padding:16px;font-size:1.3rem;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tw{overflow-x:auto}.log{max-height:170px;overflow:auto;font-size:.9rem;color:var(--mut)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 10px;margin:2px;font-size:.85rem}
.off{background:var(--bad);color:#fff;text-align:center;padding:6px;border-radius:8px;margin-bottom:10px}
button.pl{display:inline-block;margin:3px;padding:6px 10px;border:2px solid var(--line);background:var(--card);border-radius:10px;font-weight:500;font-size:.9rem;text-align:left}
button.pl.on{background:var(--acc);border-color:var(--acc);color:var(--accfg,#1a1200);font-weight:700}
.ok{color:var(--ok);font-weight:700}.no{color:var(--bad);font-weight:700}
details{margin:4px 0}summary{cursor:pointer}
#mini{position:fixed;top:0;left:0;right:0;z-index:40;display:none;align-items:center;justify-content:space-between;gap:10px;padding:calc(6px + env(safe-area-inset-top,0px)) 64px 6px 12px;background:var(--card);border-bottom:2px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.15)}
#mini .mi{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;min-width:0}
#mini .mp{font-size:1.25rem;font-weight:800;color:var(--acc)}#mini .mt{font-weight:800}#mini .mt.low{color:var(--bad)}
#mini button{padding:8px 14px;white-space:nowrap}
.hero{border-radius:20px;padding:28px 18px 24px;text-align:center;color:#fff;background:radial-gradient(circle at 50% -20%,var(--tc) -30%,#10244f 58%,#0a1633);box-shadow:0 14px 40px rgba(16,36,79,.35);margin-bottom:18px;overflow:hidden}
.hero .trophy{font-size:3.6rem;display:inline-block;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-5deg)}}
.hero h1{color:#fff;margin:.1em 0}.hero p{color:#cfd8ee;margin:.2em 0}
.hero .tag{display:inline-block;margin-top:10px;padding:6px 16px;border-radius:99px;background:rgba(255,255,255,.16);font-weight:700}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:18px 0 6px}
.pod{flex:1;max-width:210px;text-align:center}.pod .pn{font-size:2.2rem}.pod small{display:block;color:var(--mut)}
.pod .pb{margin-top:6px;border-radius:12px 12px 0 0;background:linear-gradient(180deg,var(--tc),color-mix(in srgb,var(--tc) 55%,#000));color:#fff;font-weight:800;font-size:1.4rem;padding-top:8px;transform-origin:bottom;animation:rise .9s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{transform:scaleY(0)}}
.sb{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;margin:6px 0}
.bar2{height:14px;border-radius:8px;background:var(--line);overflow:hidden}
.bar2 i{display:block;height:100%;border-radius:8px;animation:grow 1.1s cubic-bezier(.2,.9,.3,1) both}
@keyframes grow{from{width:0}}
.tc{border:2px solid var(--line);border-left:8px solid var(--tc);border-radius:16px;background:var(--card);padding:14px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.06);animation:cardin .5s both}
@keyframes cardin{from{opacity:0;transform:translateY(14px)}}
.th{display:flex;align-items:center;gap:12px}.th .sc{margin-left:auto;text-align:right;font-size:1.9rem;font-weight:800;color:var(--tc);line-height:1}.th .sc small{display:block;font-size:.7rem;color:var(--mut);font-weight:600}
.rk{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;background:var(--tc);color:#fff;font-weight:800}
.xr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.xk{min-width:112px;font-weight:700;font-size:.82rem;color:var(--mut)}
.pc{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border:1px solid var(--line);border-radius:99px;font-size:.88rem}.pc b{color:var(--mut);font-weight:700}
.pc.gold{background:linear-gradient(135deg,#ffe58a,#f5b400);border-color:#d89a00;color:#3a2a00}.pc.gold b{color:#5a4200}
.pc.silver{background:linear-gradient(135deg,#f1f3f7,#cfd6e2);border-color:#aab3c5;color:#1d2433}.pc.silver b{color:#3a4358}
.bn{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.bn span{padding:3px 10px;border-radius:99px;background:rgba(127,127,127,.15);font-size:.82rem;font-weight:600}
.you{background:var(--acc);color:var(--accfg,#1a1200);border-radius:6px;padding:1px 6px;font-size:.7rem;font-weight:800;vertical-align:middle}
.tt{border-collapse:collapse;width:100%}.tt th,.tt td{padding:8px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}.tt th:nth-child(2),.tt td:nth-child(2){text-align:left}
.tt tr.ch{background:rgba(245,180,0,.2)}
.po{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.pm{border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--card)}.pm small{color:var(--mut)}
.gm{display:inline-block;margin:3px;padding:3px 9px;border-radius:99px;font-size:.8rem;font-weight:700;color:#fff}

.lot{position:relative;transition:border-color .3s}
.lot.flash{animation:flash .55s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--acc)}100%{box-shadow:0 0 0 20px transparent}}
.bid.pulse{animation:pulse .35s ease-out;display:inline-block}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-10px)}30%{transform:translateX(9px)}45%{transform:translateX(-7px)}60%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.tbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--acc);width:var(--from);animation:shrink linear forwards}
.tbar.low i{background:var(--bad)}
@keyframes shrink{from{width:var(--from)}to{width:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.stampov{position:fixed;display:flex;align-items:center;justify-content:center;animation:fadeout .4s 2.2s forwards}
@keyframes fadeout{to{opacity:0}}
.stampbox{display:grid;gap:2px;text-align:center;border:6px solid var(--tc);color:var(--tc);background:var(--card);border-radius:14px;padding:10px 26px;transform:rotate(-8deg);animation:slam .45s cubic-bezier(.2,1.4,.4,1);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.stampbox b{font-size:clamp(2.6rem,11vw,5rem);line-height:1;letter-spacing:.06em;font-weight:800}
.stampbox span{font-size:1.1rem;font-weight:700;color:var(--fg)}
@keyframes slam{0%{transform:scale(3.2) rotate(-20deg);opacity:0}60%{transform:scale(.92) rotate(-8deg);opacity:1}80%{transform:scale(1.05) rotate(-8deg)}100%{transform:scale(1) rotate(-8deg)}}
.cf{position:absolute;top:-24px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
#mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:60;border-radius:99px;padding:5px 11px;background:var(--card);border-color:var(--line);font-size:1.05rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.feed{display:grid;gap:4px}
.fb{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.fb.top{border-color:var(--acc);font-weight:700}
.pr{padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:6px}
.pr.hot{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.pr.mine .pt{font-weight:800}
.pt{display:flex;justify-content:space-between;gap:8px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:5px 0}
.bar i{display:block;height:100%;border-radius:4px;background:var(--acc);transition:width .4s}
.ps{font-size:.8rem;color:var(--mut)}
.panel{border:2px solid var(--line);border-radius:14px;background:var(--card);padding:12px}
.rcs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:6px 0}
.rc{border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.rc b{font-size:1.3rem}.rc small{color:var(--mut)}
.chips span{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 10px;margin:2px;font-size:.82rem}
.pill.K-W{border-color:#c77d0a}.pill.K-B{border-color:#2b6fd6}.pill.K-A{border-color:#7b3fc4}.pill.K-L{border-color:#1c8a4a}

</style></head>
<body><main id="app"></main><div id="fx"></div><div id="mini"></div><button id="mute" aria-label="Toggle sound">🔊</button>
<script>
const $=id=>document.getElementById(id),app=$("app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fm=x=>"₹"+Math.round(x*100)/100+" cr",RL={B:"Batter",L:"Bowler",A:"All-rounder",W:"Keeper"};
let S=null,ws=null,code=null,SZ=10,name=localStorage.getItem("an")||"";
let cid=localStorage.getItem("acid");if(!cid){cid=Math.random().toString(36).slice(2,12);localStorage.setItem("acid",cid)}
const rq=new URLSearchParams(location.search).get("room")||"";
const send=o=>ws&&ws.readyState==1&&ws.send(JSON.stringify(o));

// ---------- sound + effects ----------
let AC=null,MUTED=localStorage.getItem("asnd")=="0",FR={},clk={lot:-1,total:12,prev:0};
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=="suspended")AC.resume();return AC}
function tone(f,d=.12,type="sine",v=.12,at=0,f2){const a=ac();if(!a||MUTED)return;const t=a.currentTime+at,o=a.createOscillator(),g=a.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function thud(at=0){const a=ac();if(!a||MUTED)return;const t=a.currentTime+at,n=a.sampleRate*.18|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
 s.buffer=b;f.type="lowpass";f.frequency.value=500;g.gain.value=.5;s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);tone(110,.2,"sine",.3,at,60)}
const SFX={bid:()=>tone(660,.09,"triangle",.1),mine:()=>{tone(784,.08,"triangle",.12);tone(1175,.12,"triangle",.1,.07)},
 out:()=>tone(330,.28,"sawtooth",.07,0,190),tick:()=>tone(1300,.04,"square",.04),gavel:()=>{thud();thud(.22)},
 fan:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.28,"triangle",.12,i*.12)),uns:()=>tone(330,.45,"sine",.1,0,170)};
function fg(c){if(!/^#[0-9a-f]{6}$/i.test(c||""))return"#fff";const n=parseInt(c.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))>150?"#1a1200":"#fff"}
function accent(){const me=S&&S.teams&&S.you&&S.teams.find(t=>t.i==S.you.team),r=document.documentElement.style;
 if(me&&S.phase!="lobby"){r.setProperty("--acc",me.c);r.setProperty("--accfg",fg(me.c))}else{r.removeProperty("--acc");r.removeProperty("--accfg")}}
function confetti(cols){const f=$("fx");for(let i=0;i<80;i++){const e=document.createElement("i");e.className="cf";
 e.style.cssText=`left:${Math.random()*100}%;background:${cols[i%cols.length]};animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.5}s;transform:rotate(${Math.random()*360}deg)`;
 f.appendChild(e);setTimeout(()=>e.remove(),4200)}}
function showSold(cur){
 const L=cur.lot,lead=cur.teams.find(t=>t.i==L.lead),y=cur.you.team,r=(document.querySelector(".lot")||document.body).getBoundingClientRect(),o=document.createElement("div");
 o.className="stampov";o.style.cssText=`top:${r.top}px;left:${r.left}px;width:${r.width}px;height:${r.height}px`;
 o.innerHTML=`<div class="stampbox" style="--tc:${lead?lead.c:"#7a7a7a"}"><b>${lead?"SOLD":"UNSOLD"}</b>${lead?`<span>${esc(L.p.n)} → ${esc(lead.n)}</span><span>${fm(L.cur)}</span>`:`<span>${esc(L.p.n)}</span>`}</div>`;
 $("fx").appendChild(o);setTimeout(()=>o.remove(),2700);
 if(!lead)SFX.uns();else if(lead.i==y){SFX.fan();confetti([lead.c,"#ffd54a","#ffffff","#ff6b6b"])}else SFX.gavel();
}
function fx(prev,cur){
 FR={};
 if(cur.phase=="end"&&prev&&prev.phase!="end"){const w=cur.tour?cur.res.find(x=>x.n==cur.tour.champion):cur.res[0];confetti([w.c,"#ffd54a","#ffffff","#ff6b6b"]);SFX.fan();return}
 if(!prev||prev.phase!="auction"||cur.phase!="auction"||!prev.lot||!cur.lot)return;
 const a=prev.lot,b=cur.lot,y=cur.you.team;
 if(a.i!=b.i){clk={lot:b.i,total:Math.max(1,b.tl),prev:b.tl};return}
 if(b.nbids>a.nbids){FR.bid=1;clk.total=Math.max(1,b.tl);
  if(b.lead==y){FR.mine=1;SFX.mine()}else if(a.lead==y&&y!=null){FR.outbid=1;SFX.out()}else SFX.bid()}
 if(b.st=="result"&&a.st!="result")showSold(cur);
 else if(b.st=="bidding"&&b.tl<a.tl&&b.tl>=1&&b.tl<=3)SFX.tick();
}
const mb=$("mute");mb.textContent=MUTED?"🔇":"🔊";
mb.addEventListener("click",()=>{MUTED=!MUTED;localStorage.setItem("asnd",MUTED?"0":"1");mb.textContent=MUTED?"🔇":"🔊";if(!MUTED){ac();SFX.bid()}});
document.addEventListener("pointerdown",()=>ac());
const mini=$("mini");
function updateMini(){
 const lot=document.querySelector(".lot");
 if(!S||S.phase!="auction"||!S.lot||!lot||lot.getBoundingClientRect().bottom>0){mini.style.display="none";return}
 const L=S.lot,T=S.teams,lead=T.find(t=>t.i==L.lead),me=T.find(t=>t.i==S.you.team),res=L.st=="result";
 mini.style.display="flex";
 mini.innerHTML=`<div class="mi"><b>${esc(L.p.n)}</b><span class="mp">${fm(L.cur??L.p.b)}</span><span>${lead?esc(lead.n):"no bids yet"}</span><span class="mt ${L.tl<=2?"low":""}">${Math.max(0,L.tl)}s</span></div>${me?`<button class="go" id="bid2" style="background:${me.c};border-color:${me.c};color:${fg(me.c)}" ${L.can?"":"disabled"}>${res?"…":me.i==L.lead?"You lead":"Bid "+fm(L.nb)}</button>`:""}`;
}
window.addEventListener("scroll",updateMini,{passive:true});
mini.addEventListener("pointerdown",e=>{if(e.target.closest("#bid2")&&S&&S.lot&&S.lot.can)send({t:"bid"})});
function endFx(){document.querySelectorAll(".cu").forEach(el=>{const to=+el.dataset.to,t0=performance.now();
 const step=t=>{if(!el.isConnected)return;const k=Math.min(1,(t-t0)/1100);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
function connect(c){
 code=c.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);history.replaceState(null,"","?room="+code);S=null;render();open();
}
function open(){
 const u=(location.protocol=="https:"?"wss":"ws")+"://"+location.host+"/ws/"+code+"?cid="+cid+"&name="+encodeURIComponent(name);
 ws=new WebSocket(u);
 ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.t=="state"){const prev=S;S=m;fx(prev,m);render();FR={}}else if(m.t=="err")alert(m.m)};
 ws.onclose=()=>{if(code){if(S)S.off=1;render();setTimeout(open,1500)}};
}
function render(){
 if(!code)return landing();
 if(!S)return app.innerHTML="<h1>Connecting…</h1>";
 const off=S.off?'<div class="off">Connection lost. Reconnecting…</div>':"";
 accent();
 app.innerHTML=off+(S.phase=="lobby"?lobby():S.phase=="auction"?auction():S.phase=="xi"?xiView():end());
 updateMini();if(S.phase=="end")endFx();
}
function landing(){
 app.innerHTML=`<h1>Auction Room</h1><p>A live multiplayer player auction. Bid against friends and AI franchises. Unofficial fan project; ratings are made up.</p>
 <h2>Your name</h2><div class="row"><input id="nm" maxlength="16" placeholder="e.g. Akash" value="${esc(name)}"></div>
 <h2>${rq?"Join room "+esc(rq):"Start or join"}</h2>
 <div class="row">${rq?`<button class="go" data-a="join" data-c="${esc(rq)}">Join room ${esc(rq)}</button>`:
 `<button class="go" data-a="create">Create a room</button><input id="rc" maxlength="8" placeholder="Room code" size="10"><button data-a="join">Join</button>`}</div>`;
}
function optsBox(host){
 const M=S.mode,V=S.speed;
 const modes=[["match","🏏 Match","One playing XI. Highest score wins."],["tournament","🏆 Tournament","Whole squad plays a league and playoffs. Depth wins."]];
 const sp=[["quick","Quick","6 to 12 s per bid"],["normal","Normal","12 to 20 s"],["relaxed","Relaxed","25 to 40 s"]];
 if(!host)return `<h2>Game settings</h2><p>Mode: <b>${M=="match"?"Match":"Tournament"}</b> · Bidding speed: <b>${V}</b></p>`;
 return `<h2>Game mode</h2><div class="grid">${modes.map(([k,n,d])=>`<button class="team ${M==k?"me":""}" data-a="mode" data-v="${k}"><b>${n}</b><small>${d}</small></button>`).join("")}</div>
 <h2>Bidding speed</h2><div class="grid">${sp.map(([k,n,d])=>`<button class="team ${V==k?"me":""}" data-a="speed" data-v="${k}"><b>${n}</b><small>${d}</small></button>`).join("")}</div>`;
}
function customBox(host){
 const c=S.custom;
 const sum=c?`<div class="panel"><b class="ok">✓ Custom list: ${c.n} players</b> from ${esc(c.file)}<div class="ps">${c.W} keepers · ${c.B} batters · ${c.A} all-rounders · ${c.L} bowlers · ${c.ov} overseas. Only these players will be auctioned.${c.notes.map(n=>" "+esc(n)).join("")}</div></div>`:"";
 if(!host)return c?`<h2>Player list</h2>${sum}`:"";
 return `<h2>Custom player list (optional)</h2><p>Upload an Excel or CSV file with the columns <b>Name, Rating, Position, Overseas</b>. Only the players in your file will come up for auction. <a href="/template.xlsx">Download template</a></p>
 <div class="row"><input type="file" id="cf" accept=".xlsx,.xlsm,.csv,.txt">${c?`<button data-a="nocustom">Use default players</button>`:""}</div>${sum}`;
}
function lobby(){
 const link=location.origin+"/?room="+S.code,y=S.you;
 return `<h1>Room ${esc(S.code)}</h1>
 <p>Share this link with friends:</p><div class="row"><input id="lk" readonly value="${esc(link)}" size="34"><button data-a="copy">Copy</button></div>
 <h2>Players here</h2><div>${S.people.map(p=>`<span class="pill">${esc(p.n)}${p.host?" (host)":""}${p.on?"":" · away"}</span>`).join("")}</div>
 <h2>Pick your franchise</h2><div class="grid">${S.fr.map((f,i)=>`<button class="team ${y.claim==i?"me":f.o?"taken":""}" data-a="pick" data-i="${i}"><i style="background:${f.c}"></i>${f.n}<small>${y.claim==i?"You":f.o?esc(f.o):"AI unless claimed"}</small></button>`).join("")}</div>
 ${optsBox(y.host)}
 ${customBox(y.host)}
 ${y.host?`<h2>Start</h2><div class="row"><label>Teams in the auction <select id="sz">${[2,3,4,5,6,7,8,9,10].map(n=>`<option ${n==SZ?"selected":""}>${n}</option>`).join("")}</select></label><button class="go" data-a="start">Start auction</button></div>
 <p>Unclaimed franchises are played by the AI. A 2-team duel takes roughly 20 to 40 minutes depending on the bidding speed.</p>`:"<p>Waiting for the host to start.</p>"}
 <p>Rules: ${fm(S.limits.purse)} purse, squads of ${S.limits.min} to ${S.limits.max}, at most ${S.limits.ov} overseas players.</p>`;
}
function squadPanel(me){
 const sq=S.mine,cnt=k=>sq.filter(x=>x.k==k).length,W=cnt("W"),B=cnt("B"),A=cnt("A"),Lb=cnt("L"),ov=sq.filter(x=>x.o).length;
 const roles=[["Keepers",W,2],["Batters",B,6],["All-rounders",A,5],["Bowlers",Lb,8]];
 const slots=Math.max(0,S.limits.min-sq.length),per=slots?me.purse/slots:0;
 const chk=(ok,t)=>`<span class="${ok?"ok":"no"}">${ok?"✓":"✗"} ${t}</span>`;
 const grp=k=>{const l=sq.filter(x=>x.k==k);return l.length?`<div><small>${RL[k]}s</small><br>${l.map(x=>`<span class="pill K-${k}">${esc(x.n)}${x.o?" ✈":""} · ${x.r} · ${fm(x.paid)}</span>`).join("")}</div>`:""};
 return `<h2>Your squad</h2><div class="panel">
  <div class="pt"><span>Purse left</span><b>${fm(me.purse)}</b></div>
  <div class="pt"><span>Squad</span><b>${sq.length} / ${S.limits.max}</b></div>
  <div class="ps">${slots?`Need ${slots} more to reach ${S.limits.min}. About ${fm(per)} per slot.`:`Minimum squad of ${S.limits.min} reached.`}</div>
  <div class="pt" style="margin-top:6px"><span>Overseas slots</span><b>${ov} / ${S.limits.ov} used</b></div>
  <div class="rcs">${roles.map(([n,c,t])=>`<div class="rc"><small>${n}</small><br><b>${c}</b> <small>/ ${t} suggested</small><div class="bar"><i style="width:${Math.min(100,c/t*100)}%"></i></div></div>`).join("")}</div>
  <div class="chips"><small>Needed for a proper XI</small><br>${chk(W>=1,"Keeper")}${chk(B+W>=4,"4+ batters")}${chk(Lb>=3,"3+ bowlers")}${chk(Lb+A>=5,"5+ bowlers or all-rounders")}</div>
  <div style="margin-top:8px">${grp("W")}${grp("B")}${grp("A")}${grp("L")}${sq.length?"":"<p>Nobody yet.</p>"}</div></div>`;
}
function auction(){
 const L=S.lot,p=L.p,y=S.you,T=S.teams,lead=T.find(t=>t.i==L.lead),me=T.find(t=>t.i==y.team),res=L.st=="result";
 if(clk.lot!=L.i||L.tl>clk.prev)clk.total=Math.max(1,L.tl);clk.lot=L.i;clk.prev=L.tl;
 const pct=Math.min(100,Math.max(0,L.tl/clk.total*100)),left=Math.max(0,L.tl);
 return `<div class="lot ${FR.bid?"flash":""}" style="border-color:${lead?lead.c:"var(--fg)"}"><div>Lot ${L.i} of ${L.of}</div><div class="name">${esc(p.n)}</div>
 <div>${RL[p.k]}, ${p.o?"overseas":"Indian"} · rating ${p.r} · base ${fm(p.b)}</div>
 <div><span class="bid ${FR.bid?"pulse":""}">${fm(L.cur??p.b)}</span></div>
 ${res?`<div class="stamp ${L.last=="UNSOLD"?"uns":"sold"}">${esc(L.last)}</div>`:`<div class="stamp">${lead?`Leading: <b style="color:${lead.c}">${esc(lead.n)}</b>`:"Waiting for an opening bid"}</div>
 <div class="tbar ${left<=2?"low":""}"><i style="--from:${pct}%;animation-duration:${left}s"></i></div><div class="clock" style="color:${left<=5?"var(--bad)":"inherit"}">${left}s</div>`}</div>
 ${me?`<button class="go bigbtn ${FR.outbid?"shake":""}" id="bid" style="background:${me.c};border-color:${me.c};color:${fg(me.c)}" ${L.can?"":"disabled"}>${res?"Next player coming…":me.i==L.lead?"You lead":"Bid "+fm(L.nb)}</button>`:"<p>You are spectating.</p>"}
 <div class="cols"><div>
  <h2>Bids on this player</h2><div class="feed">${L.bids.length?L.bids.map((b,i)=>`<div class="fb ${i==0?"top":""}"><span><b style="color:${b.c}">■</b> ${esc(b.n)}</span><span>${fm(b.a)}</span></div>`).join(""):"<p>No bids yet.</p>"}</div>
  <h2>Purses</h2>${T.map(t=>`<div class="pr ${t.i==L.lead?"hot":""} ${t.i==y.team?"mine":""}"><div class="pt"><span><b style="color:${t.c}">■</b> ${esc(t.n)}${t.o?" ("+esc(t.o)+")":""}${t.i==y.team?" ← you":""}</span><span>${fm(t.purse)}</span></div>
   <div class="bar"><i style="width:${Math.max(0,t.purse/S.limits.purse*100)}%;background:${t.c}"></i></div>
   <div class="ps">${t.cnt}/${S.limits.max} players · ${t.ov}/${S.limits.ov} overseas · WK ${t.W} · BAT ${t.B} · AR ${t.A} · BOWL ${t.L}</div></div>`).join("")}
 </div><div>${me?squadPanel(me):""}</div></div>
 <h2>Sales</h2><div class="log">${S.log.map(l=>`<div>${esc(l)}</div>`).join("")}</div>
 ${y.host?`<p><button data-a="endnow">End auction now</button></p>`:""}`;
}
function xiInfo(sel,sq){
 const by={};sq.forEach(x=>by[x.n]=x);const xi=sel.map(n=>by[n]).filter(Boolean);
 const c=k=>xi.filter(x=>k.includes(x.k)).length;
 const o={xi,n:xi.length,ov:xi.filter(x=>x.o).length,wk:c("W"),bowl:c("LA"),bat:c("BWA"),base:xi.reduce((a,x)=>a+x.r,0)};
 o.pts=(o.wk?8:0)+(o.bowl>=5?10:0)+(o.bat>=5?6:0);return o;
}
function xiView(){
 const y=S.you,X=S.xi,me=S.teams.find(t=>t.i==y.team);
 const wait=`<h2>Who has locked their XI</h2><div>${X.wait.map(w=>`<span class="pill">${esc(w.n)}${w.who?" ("+esc(w.who)+")":""} · ${w.ok?"✓ locked":"picking…"}</span>`).join("")}</div>`;
 const host=y.host?`<p><button data-a="reveal">Reveal results now</button></p>`:"";
 if(!me)return `<h1>Teams are picking their XI</h1><p>You are spectating. Results appear when everyone locks in.</p>${wait}${host}`;
 const I=xiInfo(X.sel,S.mine),sel=new Set(X.sel),lk=X.locked;
 const ready=I.n==Math.min(11,S.mine.length)&&X.rules.every(r=>I.xi.filter(x=>r.ks.includes(x.k)).length>=r.need);
 const grp=k=>{const l=S.mine.filter(x=>x.k==k).sort((a,b)=>b.r-a.r);
  return l.length?`<h2>${RL[k]}s (${l.length})</h2><div>${l.map(x=>`<button class="pl ${sel.has(x.n)?"on":""}" data-a="tog" data-n="${esc(x.n)}" ${lk?"disabled":""}>${esc(x.n)}${x.o?" ✈":""} · ${x.r}</button>`).join("")}</div>`:""};
 const t=(ok,txt)=>`<span class="${ok?"ok":"no"}">${ok?"✓":"✗"}</span> ${txt}`;
 return `<h1>Pick your XI</h1><p>Choose your 11 from your squad, like a proper cricket team: a keeper, batting depth and a full bowling attack. Max ${X.max_ov} overseas (✈). Tap a player to add or remove.</p>
 <div class="lot"><div class="name">${I.n} / 11 selected</div>
 <div>Overseas ${I.ov}/${X.max_ov} · Rating total ${I.base}</div>
 <div>${X.rules.map(r=>{const c=I.xi.filter(x=>r.ks.includes(x.k)).length;return t(c>=r.need,"At least "+r.need+" "+r.label+" (you have "+c+")")}).join("<br>")}</div>
 <div>Bonuses: ${I.wk?"keeper +8 ":""}${I.bowl>=5?"· bowling attack +10 ":""}${I.bat>=5?"· batting depth +6":""}</div>
 <div class="stamp">Projected score: ${I.base+I.pts}</div></div>
 <div class="row" style="margin-top:10px">${lk?`<button data-a="unlock">Edit XI</button><span class="ok">Locked ✓ waiting for others</span>`:`<button class="go" data-a="lock" ${ready?"":"disabled"}>Lock my XI</button>`}</div>
 ${grp("W")}${grp("B")}${grp("A")}${grp("L")}${wait}${host}`;
}
const MEDAL=["🥇","🥈","🥉"];
function xiCard(x,rank){
 const g=k=>x.xi.filter(p=>p.k==k).sort((a,b)=>b.r-a.r);
 const row=(k,ic)=>{const l=g(k);return l.length?`<div class="xr"><span class="xk">${ic} ${RL[k]}s</span>${l.map(p=>`<span class="pc ${p.r>=90?"gold":p.r>=80?"silver":""}">${esc(p.n)}${p.o?" ✈":""}<b>${p.r}</b></span>`).join("")}</div>`:""};
 const bonus=[x.kb?"🧤 Keeper +"+x.kb:"",x.bb?"🎯 Bowling attack +"+x.bb:"",x.tb?"🏏 Batting depth +"+x.tb:"",x.pen?"⚠ Small squad "+x.pen:""].filter(Boolean);
 return `<div class="tc" style="--tc:${x.c};animation-delay:${rank*.12}s"><div class="th"><span class="rk">${rank}</span><div><b>${esc(x.n)}</b>${x.o?` <small>(${esc(x.o)})</small>`:""}${S.you.team==x.i?` <span class="you">YOU</span>`:""}</div><div class="sc"><b class="cu" data-to="${x.score}">0</b><small>match score</small></div></div>
 ${row("W","🧤")}${row("B","🏏")}${row("A","⚡")}${row("L","🎯")}
 <div class="bn"><span>XI rating ${x.base}</span>${bonus.map(b=>`<span>${b}</span>`).join("")}</div>
 <div class="ps">Purse left ${fm(x.purse)} · Squad of ${x.sq.length}</div>
 <details><summary>Full squad</summary>${x.sq.map(p=>`<span class="pill">${esc(p.n)}${p.o?" ✈":""} · ${p.r} · ${fm(p.paid)}</span>`).join(" ")}</details></div>`;
}
function podium(l){ // l = [{n,c,o,v}] in rank order
 const hts=[150,112,84],ord=[1,0,2].filter(i=>l[i]);
 return `<div class="podium">${ord.map(i=>`<div class="pod" style="--tc:${l[i].c}"><div class="pn">${MEDAL[i]}</div><b>${esc(l[i].n)}</b><small>${esc(l[i].o||"AI")}</small><div class="pb" style="height:${hts[i]}px;animation-delay:${.25*(2-i)}s">${l[i].v}</div></div>`).join("")}</div>`;
}
function hero(c,title,sub,tag){return `<div class="hero" style="--tc:${c}"><div class="trophy">🏆</div><h1>${title}</h1><p>${sub}</p>${tag?`<div class="tag">${tag}</div>`:""}</div>`}
function end(){
 const R=S.res,T=S.tour,y=S.you.team,host=S.you.host?`<p><button class="go" data-a="lobby">Back to lobby</button></p>`:"";
 const place=n=>n==1?"1st":n==2?"2nd":n==3?"3rd":n+"th";
 if(T){
  const by={};R.forEach(x=>by[x.n]=x);const ord=T.order.map(n=>by[n]),ch=ord[0],mine=ord.findIndex(x=>x.i==y)+1;
  const series=T.format.startsWith("Best");
  const sc=series?T.playoffs.reduce((a,g)=>(a[g.w]=(a[g.w]||0)+1,a),{}):null;
  return hero(ch.c,esc(ch.n)+" are the champions!",series?`Won the series ${sc[ch.n]||0} to ${sc[T.runner]||0} against ${esc(T.runner)}`:`${esc(T.format)}. Runner-up: ${esc(T.runner)}`,mine?(mine==1?"🎉 That's your team. Congratulations!":"Your team finished "+place(mine)):"")
  +podium(ord.slice(0,3).map((x,i)=>({n:x.n,c:x.c,o:x.o,v:place(i+1)})))
  +`<h2>${series?"The series":"Playoffs"}</h2><div class="po">${T.playoffs.map(g=>`<div class="pm"><small>${esc(g.round)}</small><div><b style="color:${g.ac}">${esc(g.a)}</b> v <b style="color:${g.bc}">${esc(g.b)}</b></div><div>🏆 <b>${esc(g.w)}</b></div></div>`).join("")}</div>
  <h2>${series?"Series":"League"} table</h2><div class="tw"><table class="tt"><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>L</th><th>Pts</th><th>XI</th><th>Depth loss</th><th>Hit by injuries</th></tr>${T.table.map((x,i)=>`<tr class="${x.n==ch.n?"ch":""}"><td>${i+1}</td><td><b style="color:${x.c}">■</b> ${esc(x.n)}${x.o?" ("+esc(x.o)+")":""}</td><td>${x.p}</td><td>${x.w}</td><td>${x.l}</td><td><b>${x.pts}</b></td><td>${x.full}</td><td>−${x.depth}</td><td>${x.inj}</td></tr>`).join("")}</table></div>
  <p class="ps">Every match, players can be injured or rested and the next-best bench players step in. <b>Depth loss</b> is how much weaker the XI was on average after that, so smaller means a deeper squad. <b>Hit by injuries</b> is the number of matches that lost at least one of your chosen XI.</p>
  <h2>Squads</h2>${ord.map((x,i)=>xiCard(x,i+1)).join("")}${host}`;
 }
 const w=R[0],mine=R.findIndex(x=>x.i==y)+1,lo=R[R.length-1].score-30,hi=w.score;
 return hero(w.c,esc(w.n)+" win the auction!",R[1]?`${w.score} points, ${w.score-R[1].score} ahead of ${esc(R[1].n)}`:`${w.score} points`,mine?(mine==1?"🎉 That's your team. Congratulations!":"Your team finished "+place(mine)):"")
 +podium(R.slice(0,3).map(x=>({n:x.n,c:x.c,o:x.o,v:x.score})))
 +`<h2>Scores</h2>${R.map(x=>`<div class="sb"><b style="color:${x.c}">${esc(x.n)}</b><div class="bar2"><i style="width:${Math.max(6,(x.score-lo)/Math.max(1,hi-lo)*100)}%;background:${x.c}"></i></div><b>${x.score}</b></div>`).join("")}
 <p class="ps">Score = total rating of the playing XI (max 4 overseas) plus bonuses: keeper +8, bowling attack of 5+ bowlers or all-rounders +10, batting depth of 5+ batters, keepers or all-rounders +6. Squads under ${S.limits.min} lose 100.</p>
 <h2>Playing XIs</h2>${R.map((x,i)=>xiCard(x,i+1)).join("")}${host}`;
}
app.addEventListener("pointerdown",e=>{if(e.target.closest("#bid")&&S&&S.lot&&S.lot.can)send({t:"bid"})});
app.addEventListener("change",e=>{
 if(e.target.id!="cf"||!e.target.files[0])return;const f=e.target.files[0];
 if(f.size>1000000){alert("File is too big (max 1 MB).");e.target.value="";return}
 const r=new FileReader();r.onload=()=>{const u=new Uint8Array(r.result);let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
  send({t:"upload",name:f.name,data:btoa(s)})};r.readAsArrayBuffer(f);
});
app.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a=="create"||a=="join"){
  const n=($("nm").value||"").trim();if(!n){$("nm").focus();return}name=n;localStorage.setItem("an",n);
  const c=a=="create"?Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.random()*24|0]).join(""):(b.dataset.c||$("rc").value);
  if(c.trim())connect(c);
 }else if(a=="pick")send({t:"pick",i:+b.dataset.i});
 else if(a=="start"){SZ=+$("sz").value;send({t:"start",size:SZ})}
 else if(a=="endnow"){if(confirm("End the auction for everyone now?"))send({t:"end"})}
 else if(a=="lobby")send({t:"lobby"});
 else if(a=="nocustom")send({t:"nocustom"});
 else if(a=="mode"||a=="speed")send({t:"opts",[a]:b.dataset.v});
 else if(a=="tog"){
  if(!S.xi||S.xi.locked)return;const by={};S.mine.forEach(x=>by[x.n]=x);const n=b.dataset.n;let sel=[...S.xi.sel];
  if(sel.includes(n))sel=sel.filter(x=>x!=n);
  else{if(sel.length>=11){alert("You already have 11. Remove someone first.");return}
   if(by[n].o&&sel.filter(m=>by[m].o).length>=S.xi.max_ov){alert("Max "+S.xi.max_ov+" overseas players in the XI.");return}
   sel.push(n)}
  send({t:"xi",names:sel});
 }
 else if(a=="lock")send({t:"lock"});
 else if(a=="unlock")send({t:"unlock"});
 else if(a=="reveal"){if(confirm("Show results now? Anyone who has not locked gets a balanced XI filled in for them."))send({t:"reveal"})}
 else if(a=="copy"){const v=$("lk").value;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>b.textContent="Copied").catch(()=>{$("lk").select();b.textContent="Select and copy"})}
});
render();
</script></body></html>
